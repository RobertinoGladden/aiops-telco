name: ${COMPOSE_PROJECT_NAME:-telco-aiops-v2}

x-app: &app
  build: .
  image: telco-aiops-app:local
  restart: unless-stopped
  env_file: .env
  environment: &app-env
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    MINIO_ENDPOINT: http://minio:9000
    MLFLOW_TRACKING_URI: http://mlflow:5000
    MODEL_API_URL: http://model-api:8081
    PROMETHEUS_URL: http://prometheus:9090
    GRAFANA_URL: http://grafana:3000
    ALERTMANAGER_URL: http://alertmanager:9093
    STORAGE_METRICS_URL: http://consumer:9101
    PREDICTOR_METRICS_URL: http://predictor:9102
    STORAGE_METRICS_PORT: 9101
    PREDICTOR_METRICS_PORT: 9102
    INTEGRATION_HUB_URL: http://integration-hub:8082
    CONNECTORS_FILE: /app/config/connectors.yml
    AIOPS_STATE_DB: /app/data/integrations.sqlite
  extra_hosts:
    - host.docker.internal:host-gateway

x-airflow: &airflow
  build: ./airflow
  restart: unless-stopped
  profiles: [orchestration]
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-telcoadmin}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-telcopassword123}
    MINIO_BUCKET_RAW: ${MINIO_BUCKET_RAW:-telco-raw-data}
    MINIO_BUCKET_PROC: ${MINIO_BUCKET_PROC:-telco-processed-data}
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - airflow-logs:/opt/airflow/logs
  depends_on:
    airflow-postgres: {condition: service_healthy}

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes: [zookeeper-data:/var/lib/zookeeper/data, zookeeper-log:/var/lib/zookeeper/log]
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on: [zookeeper]
    ports: ['127.0.0.1:29092:29092']
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ['CMD', 'kafka-topics', '--bootstrap-server', 'localhost:9092', '--list']
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ['/bin/bash', '-ec']
    command:
      - |
        for topic in "${KAFKA_TOPIC:-telco.network.metrics}" "${KAFKA_DLQ_TOPIC:-telco.network.dead-letter}" "${KAFKA_PREDICTIONS_TOPIC:-telco.network.predictions}"; do
          kafka-topics --bootstrap-server kafka:9092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done
    restart: 'no'

  minio:
    build:
      context: .
      dockerfile: lab/storage/Dockerfile
    image: strata-minio-community:local
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-telcoadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-telcopassword123}
    ports: ['127.0.0.1:9000:9000', '127.0.0.1:9001:9001']
    volumes: [minio-data:/data]
    restart: unless-stopped

  minio-init:
    <<: *app
    command: ['python', '-m', 'scripts.bootstrap_storage']
    depends_on: [minio]
    restart: 'no'

  mlflow:
    <<: *app
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --allowed-hosts=mlflow,mlflow:5000,localhost,localhost:5000,127.0.0.1,127.0.0.1:5000
      - --backend-store-uri=sqlite:////app/data/mlflow.db
      - --serve-artifacts
      - --artifacts-destination=s3://${MINIO_BUCKET_MODELS:-telco-models}/mlflow
    environment:
      <<: *app-env
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:-telcoadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:-telcopassword123}
    ports: ['127.0.0.1:5000:5000']
    volumes: [mlflow-data:/app/data]
    depends_on:
      minio-init: {condition: service_completed_successfully}

  model-api:
    <<: *app
    command: ['python', '-m', 'api.model_server']
    ports: ['127.0.0.1:8081:8081']
    depends_on:
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  integration-hub:
    <<: *app
    command: ['python', '-m', 'integrations.hub']
    ports: ['127.0.0.1:8082:8082']
    volumes: [hub-data:/app/data, './config:/app/config:ro']
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8082/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5

  consumer:
    <<: *app
    command: ['python', '-m', 'consumer.kafka_to_minio']
    ports: ['127.0.0.1:9101:9101']
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      minio-init: {condition: service_completed_successfully}

  predictor:
    <<: *app
    command: ['python', '-m', 'predictor.auto_predictor']
    ports: ['127.0.0.1:9102:9102']
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      model-api: {condition: service_healthy}
      integration-hub: {condition: service_healthy}

  simulator:
    <<: *app
    profiles: [demo]
    command: ['python', '-m', 'scripts.log_generator']
    depends_on:
      kafka-init: {condition: service_completed_successfully}

  trainer:
    <<: *app
    profiles: [training]
    command: ['python', '-m', 'model.train']
    restart: 'no'
    depends_on:
      minio-init: {condition: service_completed_successfully}
      mlflow: {condition: service_started}

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    command: ['--kafka.server=kafka:9092']
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    ports: ['127.0.0.1:9090:9090']
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    entrypoint: ['/bin/sh', '-ec']
    command:
      - |
        sed "s/__INTEGRATION_TOKEN__/$$INTEGRATION_API_TOKEN/g" /etc/alertmanager/template.yml > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    environment:
      INTEGRATION_API_TOKEN: ${INTEGRATION_API_TOKEN:-local-lab-change-me}
    ports: ['127.0.0.1:9093:9093']
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/template.yml:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-telco123}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports: ['127.0.0.1:3000:3000']
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/aiops_dashboard.json:/var/lib/grafana/dashboards/aiops_dashboard.json:ro
      - ./grafana/integrations_dashboard.json:/var/lib/grafana/dashboards/integrations_dashboard.json:ro
    restart: unless-stopped

  airflow-postgres:
    image: postgres:15
    profiles: [orchestration]
    environment: {POSTGRES_USER: airflow, POSTGRES_PASSWORD: airflow, POSTGRES_DB: airflow}
    volumes: [airflow-db:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD', 'pg_isready', '-U', 'airflow']
      interval: 10s
      retries: 10
    restart: unless-stopped

  airflow-init:
    <<: *airflow
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-telco123}
    command: version
    restart: 'no'

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      airflow-init: {condition: service_completed_successfully}

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init: {condition: service_completed_successfully}

volumes:
  zookeeper-data:
  zookeeper-log:
  kafka-data:
  minio-data:
  mlflow-data:
  hub-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  airflow-db:
  airflow-logs:
