worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }
http {
    server_tokens off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    # No query strings, tokens, cookies or request payloads in gateway logs.
    log_format safe '$remote_addr $request_method $uri $status';
    access_log /dev/stdout safe;
    error_log /dev/stderr warn;
    map $http_cf_connecting_ip $rate_key { "" $binary_remote_addr; default $http_cf_connecting_ip; }
    limit_req_zone $rate_key zone=console:10m rate=10r/s;
    server {
        listen 8080;
        client_max_body_size 16k;
        client_body_timeout 10s;
        client_header_timeout 10s;
        keepalive_timeout 30s;
        limit_req zone=console burst=20 nodelay;
        limit_req_status 429;
        # Only browser operations are reachable. Ingest, detection, metrics, docs and alerts remain private.
        location ~ ^(/|/assets/[A-Za-z0-9_.-]+|/console/overview|/connectors|/inventory|/topology|/incidents|/ai/status|/ai/decisions|/incidents/[A-Za-z0-9_-]+/(history|analyze)|/ai/decisions/[A-Za-z0-9_-]+/request-review)$ {
            proxy_pass http://integration-hub:8082;
            proxy_set_header Host integration-hub;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header CF-Access-Jwt-Assertion $http_cf_access_jwt_assertion;
            proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 60s;
            proxy_connect_timeout 5s;
        }
        location / { return 404; }
    }
}
