global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: telco-aiops
    environment: development
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: telco-model-api
    metrics_path: /metrics
    static_configs:
      - targets: [model-api:8081]
  - job_name: telco-integration-hub
    metrics_path: /metrics
    static_configs:
      - targets: [integration-hub:8082]
  - job_name: kafka
    static_configs:
      - targets: [kafka-exporter:9308]
  - job_name: telco-storage-worker
    static_configs:
      - targets: [consumer:9101]
  - job_name: telco-detection-worker
    static_configs:
      - targets: [predictor:9102]
