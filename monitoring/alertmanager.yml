global:
  resolve_timeout: 5m
route:
  receiver: integration-hub
  group_by: [alertname, instance, connector, consumergroup]
  group_wait: 30s
  group_interval: 1m
  repeat_interval: 4h
receivers:
  - name: integration-hub
    webhook_configs:
      - url: http://integration-hub:8082/alerts/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials: __INTEGRATION_TOKEN__
