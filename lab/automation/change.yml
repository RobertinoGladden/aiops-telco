---
- name: Apply an approved bounded operation to a dedicated FRR lab router
  hosts: lab_target
  gather_facts: false
  tasks:
    - name: Require an explicit reviewed action and dedicated site
      ansible.builtin.assert:
        that:
          - lab_approved | bool
          - inventory_hostname in ['JKT-001', 'BDG-001', 'SBY-001']
          - lab_action in ['prefer_backup', 'restore_primary', 'impair_primary', 'clear_impairment']
    - name: Execute the bounded router helper
      ansible.builtin.command:
        argv: [python3, /opt/strata/device.py, '{{ lab_action }}']
      register: result
      changed_when: true
    - name: Return actual router evidence
      ansible.builtin.debug:
        var: result.stdout
