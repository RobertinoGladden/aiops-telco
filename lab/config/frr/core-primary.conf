frr defaults traditional
hostname core-primary
service integrated-vtysh-config
ip prefix-list EXPORT seq 10 permit 10.90.0.0/24
ip prefix-list SITES seq 10 permit 10.81.1.0/24
ip prefix-list SITES seq 20 permit 10.81.2.0/24
ip prefix-list SITES seq 30 permit 10.81.3.0/24
ip prefix-list SITES seq 110 permit 10.80.1.1/32
ip prefix-list SITES seq 120 permit 10.80.2.1/32
ip prefix-list SITES seq 130 permit 10.80.3.1/32
route-map IMPORT permit 10
 match ip address prefix-list SITES
route-map EXPORT permit 10
 match ip address prefix-list EXPORT
router bgp 65100
 bgp router-id 10.90.0.1
 neighbor 10.250.0.11 remote-as 65101
 neighbor 10.250.0.12 remote-as 65102
 neighbor 10.250.0.13 remote-as 65103
 address-family ipv4 unicast
  network 10.90.0.0/24
  neighbor 10.250.0.11 route-map IMPORT in
  neighbor 10.250.0.11 route-map EXPORT out
  neighbor 10.250.0.12 route-map IMPORT in
  neighbor 10.250.0.12 route-map EXPORT out
  neighbor 10.250.0.13 route-map IMPORT in
  neighbor 10.250.0.13 route-map EXPORT out
 exit-address-family
!
line vty
