# Lab-only fragment. Map actual interfaces and install connected site/loopback/transit routes first. Review existing policies, OS release and licenses. RouterOS exports filter definitions only. No QoS, RF, credentials or physical commissioning is applied.
configure router
 autonomous-system 65106
 router-id 10.80.6.1
 policy-options
  begin
  prefix-list "STRATA-LOCAL"
   prefix 10.81.6.0/24 exact
   prefix 10.80.6.1/32 exact
  exit
  prefix-list "STRATA-CORE"
   prefix 10.90.0.0/24 exact
  exit
  policy-statement "STRATA-PRIMARY"
   entry 10
    from
     prefix-list "STRATA-CORE"
    exit
    action accept
     local-preference 100
    exit
   exit
   default-action reject
   exit
  exit
  policy-statement "STRATA-BACKUP"
   entry 10
    from
     prefix-list "STRATA-CORE"
    exit
    action accept
     local-preference 80
    exit
   exit
   default-action reject
   exit
  exit
  policy-statement "STRATA-EXPORT"
   entry 10
    from
     prefix-list "STRATA-LOCAL"
    exit
    action accept
    exit
   exit
   default-action reject
   exit
  exit
  commit
 exit
 bgp
  group "STRATA-PRIMARY"
   type external
   peer-as 65100
   import "STRATA-PRIMARY"
   export "STRATA-EXPORT"
   neighbor 10.250.0.1
   exit
  exit
  group "STRATA-BACKUP"
   type external
   peer-as 65200
   import "STRATA-BACKUP"
   export "STRATA-EXPORT"
   neighbor 10.251.0.1
   exit
  exit
 exit
exit all
