! Lab-only fragment. Map actual interfaces and install connected site/loopback/transit routes first. Review existing policies, OS release and licenses. RouterOS exports filter definitions only. No QoS, RF, credentials or physical commissioning is applied.
prefix-set STRATA-LOCAL
 10.81.21.0/24,
 10.80.21.1/32
end-set
prefix-set STRATA-CORE
 10.90.0.0/24
end-set
route-policy STRATA-PRIMARY
 if destination in STRATA-CORE then
  set local-preference 100
  pass
 else
  drop
 endif
end-policy
route-policy STRATA-BACKUP
 if destination in STRATA-CORE then
  set local-preference 80
  pass
 else
  drop
 endif
end-policy
route-policy STRATA-EXPORT
 if destination in STRATA-LOCAL then
  pass
 else
  drop
 endif
end-policy
router bgp 65121
 bgp router-id 10.80.21.1
 address-family ipv4 unicast
  network 10.81.21.0/24
  network 10.80.21.1/32
 !
 neighbor 10.250.0.1
  remote-as 65100
  address-family ipv4 unicast
   route-policy STRATA-PRIMARY in
   route-policy STRATA-EXPORT out
  !
 !
 neighbor 10.251.0.1
  remote-as 65200
  address-family ipv4 unicast
   route-policy STRATA-BACKUP in
   route-policy STRATA-EXPORT out
  !
 !
