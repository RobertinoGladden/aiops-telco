! Lab-only fragment. Map actual interfaces and install connected site/loopback/transit routes first. Review existing policies, OS release and licenses. RouterOS exports filter definitions only. No QoS, RF, credentials or physical commissioning is applied.
hostname MDN-002
ip prefix-list STRATA-LOCAL seq 10 permit 10.81.14.0/24
ip prefix-list STRATA-LOCAL seq 20 permit 10.80.14.1/32
ip prefix-list STRATA-CORE seq 10 permit 10.90.0.0/24
route-map STRATA-PRIMARY permit 10
 match ip address prefix-list STRATA-CORE
 set local-preference 100
!
route-map STRATA-BACKUP permit 10
 match ip address prefix-list STRATA-CORE
 set local-preference 80
!
route-map STRATA-EXPORT permit 10
 match ip address prefix-list STRATA-LOCAL
router bgp 65114
 bgp router-id 10.80.14.1
 neighbor 10.250.0.1 remote-as 65100
 neighbor 10.251.0.1 remote-as 65200
 address-family ipv4 unicast
  network 10.81.14.0 mask 255.255.255.0
  network 10.80.14.1 mask 255.255.255.255
  neighbor 10.250.0.1 activate
  neighbor 10.250.0.1 route-map STRATA-PRIMARY in
  neighbor 10.250.0.1 route-map STRATA-EXPORT out
  neighbor 10.251.0.1 activate
  neighbor 10.251.0.1 route-map STRATA-BACKUP in
  neighbor 10.251.0.1 route-map STRATA-EXPORT out
 exit-address-family
