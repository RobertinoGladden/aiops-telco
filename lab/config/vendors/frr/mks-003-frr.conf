! Lab-only fragment. Map actual interfaces and install connected site/loopback/transit routes first. Review existing policies, OS release and licenses. RouterOS exports filter definitions only. No QoS, RF, credentials or physical commissioning is applied.
! Strata Twin export: candidate for the matching isolated Docker lab, not a running router snapshot
frr defaults traditional
hostname MKS-003
service integrated-vtysh-config
ip prefix-list LOCAL seq 10 permit 10.81.23.0/24
ip prefix-list LOCAL seq 20 permit 10.80.23.1/32
ip prefix-list CORE seq 10 permit 10.90.0.0/24
route-map PRIMARY permit 10
 match ip address prefix-list CORE
 set local-preference 100
route-map SECONDARY permit 10
 match ip address prefix-list CORE
 set local-preference 80
route-map EXPORT permit 10
 match ip address prefix-list LOCAL
router bgp 65123
 bgp router-id 10.80.23.1
 neighbor 10.250.0.1 remote-as 65100
 neighbor 10.251.0.1 remote-as 65200
 address-family ipv4 unicast
  network 10.81.23.0/24
  network 10.80.23.1/32
  neighbor 10.250.0.1 route-map PRIMARY in
  neighbor 10.251.0.1 route-map SECONDARY in
  neighbor 10.250.0.1 route-map EXPORT out
  neighbor 10.251.0.1 route-map EXPORT out
 exit-address-family

