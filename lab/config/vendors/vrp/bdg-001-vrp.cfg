# Lab-only fragment. Map actual interfaces and install connected site/loopback/transit routes first. Review existing policies, OS release and licenses. RouterOS exports filter definitions only. No QoS, RF, credentials or physical commissioning is applied.
ip ip-prefix STRATA-LOCAL index 10 permit 10.81.2.0 24
ip ip-prefix STRATA-LOCAL index 20 permit 10.80.2.1 32
ip ip-prefix STRATA-CORE index 10 permit 10.90.0.0 24
route-policy STRATA-PRIMARY permit node 10
 if-match ip-prefix STRATA-CORE
 apply local-preference 100
 quit
route-policy STRATA-BACKUP permit node 10
 if-match ip-prefix STRATA-CORE
 apply local-preference 80
 quit
route-policy STRATA-EXPORT permit node 10
 if-match ip-prefix STRATA-LOCAL
 quit
bgp 65102
 router-id 10.80.2.1
 peer 10.250.0.1 as-number 65100
 peer 10.251.0.1 as-number 65200
 ipv4-family unicast
  network 10.81.2.0 24
  network 10.80.2.1 32
  peer 10.250.0.1 route-policy STRATA-PRIMARY import
  peer 10.251.0.1 route-policy STRATA-BACKUP import
  peer 10.250.0.1 route-policy STRATA-EXPORT export
  peer 10.251.0.1 route-policy STRATA-EXPORT export
 quit
quit
